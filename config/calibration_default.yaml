# UNVERIFIED default mapping for "OpenTX Radiomaster Zorro Joystick".
# Used only until calibrate.py writes config/calibration.yaml.
#
# Basis: OpenTX USB-joystick mode exports CH1..CH7 as axes 0..6. With the usual
# AETR channel order that is roll, pitch, throttle, yaw. Observed at rest on
# Observed at rest: axes 0,1,3 ~ 0 (centred sticks),
# axis 2 = -1 (throttle low), axes 4..6 = -1, +1, +1 (switches).
# Inversion and which switch is which are GUESSES. Run calibrate.py.
device_name: OpenTX Radiomaster Zorro Joystick
verified: false
mode: 2
axes:
  roll:     {axis: 0, min: -1.0, center: 0.0, max: 1.0, invert: false}
  pitch:    {axis: 1, min: -1.0, center: 0.0, max: 1.0, invert: false}
  throttle: {axis: 2, min: -1.0, max: 1.0, invert: false}
  yaw:      {axis: 3, min: -1.0, center: 0.0, max: 1.0, invert: false}
switches:
  arm:    {kind: axis, index: 4, invert: false, threshold: 0.0}
  preset: {kind: axis, index: 5, positions: 3, invert: false}
